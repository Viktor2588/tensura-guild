<!DOCTYPE html>
<!--
  Tensura Guild braucht KEINEN Build. Die acht Skripte unten sind klassische
  Skripte: sie haengen ihre Schnittstelle an globalThis und verlassen sich auf
  ihre Reihenfolge. Ein Bundler macht daraus ES-Module und bricht damit.

  So starten:
      index.html doppelklicken            (file:// genuegt)
      npm start   bzw.  bun run start     -> http://localhost:8080

  NICHT `bun index.html` — das startet Buns Dev-Server mit Hot-Reload, der die
  Skripte bundelt und mit einem eigenen Fehler abbricht:
  "Failed to load bundled module ... this is a bug in Bun's bundler".
-->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tensura Guild</title>
<meta name="description" content="Roguelite-Truppenbau im Universum von That Time I Got Reincarnated as a Slime.">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header id="hud">
  <div class="hud-links">
    <strong>Tensura&nbsp;Guild</strong>
    <span id="hud-ort">Akt 1 · Knoten 1</span>
  </div>
  <div class="hud-werte">
    <span>⚠ <b id="hud-stufe">0</b></span>
    <span title="Magicule">✦ <b id="hud-mag">0</b></span>
    <span title="Verbleibende Niederlagen">❤ <b id="hud-leben">3</b></span>
    <button id="btn-menu" type="button">Menü</button>
  </div>
</header>
<nav id="pfad"></nav>

<main id="view"></main>

<section id="unten">
  <div id="wahl"></div>
  <div id="synergien"></div>
  <div id="team"></div>
  <div id="beutel"></div>
  <div id="reliktliste"></div>
</section>

<dialog id="menu">
  <h2>Menü</h2>
  <p id="menu-info"></p>
  <div class="reihe" id="menu-effekte">
    <span>Effekte:</span>
    <button type="button" data-a="effekte" data-v="voll">Voll</button>
    <button type="button" data-a="effekte" data-v="sparsam">Sparsam</button>
    <button type="button" data-a="effekte" data-v="aus">Aus</button>
  </div>
  <div class="reihe" id="menu-ton">
    <span>Ton:</span>
    <button type="button" data-a="ton" data-v="voll">Voll</button>
    <button type="button" data-a="ton" data-v="sparsam">Sparsam</button>
    <button type="button" data-a="ton" data-v="aus">Aus</button>
  </div>
  <div class="reihe">
    <button type="button" data-a="speichern">Speichern</button>
    <button type="button" data-a="neu">Neuer Run</button>
    <button type="button" data-a="menu-zu">Zurück</button>
  </div>
  <div class="reiter" id="menu-reiter">
    <button type="button" data-reiter="linien" class="an">Entwicklungslinien</button>
    <button type="button" data-reiter="fortschritt">Fortschritt</button>
    <button type="button" data-reiter="glossar">Glossar</button>
    <button type="button" data-reiter="chronik">Chronik</button>
  </div>
  <section class="blatt" data-blatt="linien">
    <p class="hinweis">Sechzehn Passive je Einheit, vier je Linie — frei kombinierbar, ohne Reihenfolge. Eine bringt die Einheit beim Anwerben zufällig mit.</p>
    <div class="reihe linien-wahl">
      <label for="linien-einheit">Einheit</label>
      <select id="linien-einheit"></select>
    </div>
    <div id="menu-linien" class="linien-uebersicht"></div>
  </section>
  <section class="blatt" data-blatt="fortschritt" hidden>
    <div id="menu-meta"></div>
  </section>
  <section class="blatt" data-blatt="glossar" hidden>
    <div id="menu-glossar"></div>
  </section>
  <section class="blatt" data-blatt="chronik" hidden>
    <ol id="menu-chronik"></ol>
  </section>
</dialog>

<script src="js/vendor/three.min.js"></script>
<script src="js/rng.js"></script>
<script src="js/hex.js"></script>
<script src="js/fx.js"></script>
<script src="js/klang.js"></script>
<script src="js/brett3d.js"></script>
<script src="js/abilities.js"></script>
<script src="js/data.js"></script>
<script src="js/combat.js"></script>
<script src="js/enemies.js"></script>
<script src="js/regie.js"></script>
<script src="js/run.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
